[project]
name = "turkish-corpus"
version = "0.1.0"
description = "High-quality ~1B-token Turkish (Türkçe) LLM pretraining corpus pipeline (HPLT v2 anchor) and crawler."
readme = "README.md"
authors = [
    { name = "BerkayRA", email = "b.adanali@gmail.com" }
]
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    # Light runtime dep used by the pluggable token counter. The Turkish-specific
    # modules (normalization, PII) are pure-Python and need nothing else.
    "tokenizers>=0.20",
]

[project.optional-dependencies]
# The datatrove cleaning pipeline. Heavy; install on the Linux production box (and
# on a dev machine to run end-to-end slices):  uv sync --extra pipeline
pipeline = [
    "datatrove[io,processing]>=0.5.0",
    "fasttext-wheel>=0.9.2",
    "huggingface-hub>=0.25",
    "datasets>=3.0",  # required by datatrove's HuggingFaceDatasetReader (HPLT hf source)
    "spacy>=3.7",  # datatrove's Turkish word tokenizer (MinHash n-grams) uses spaCy
]
# Full-accuracy Turkish casing via ICU. Needs system icu4c (brew install icu4c).
# Optional: the package ships a correct pure-Python Turkish casing fallback.
icu = ["PyICU>=2.12"]
# Mojibake / encoding repair (HPLT is already ftfy-cleaned; useful for fresh crawl text).
encoding = ["ftfy>=6.2"]
# Register-diverse blend sources (roadmap step 2). HF-hosted sources (Turkish Wikipedia,
# the mevzuat gov mirror) stream via `datasets`; requests for the scraped/gov endpoints.
sources = ["datasets>=3.0", "requests>=2.32", "defusedxml>=0.7"]
# Academic ingestion (YÖKTEZ theses, DergiPark): born-digital PDF text extraction. Scanned
# PDFs additionally need an OCR step (tesseract) — documented, not a hard dependency.
academic = ["pypdf>=4.0", "pdfplumber>=0.11", "requests>=2.32"]
# SentencePiece token counting for tokenizers trained/exported in the turkish-llm repo
# (sp_unigram_*.model, sp_morph_*.model). HF tokenizer.json works via the core `tokenizers`
# dep; this extra adds .model support for the standalone counter / fertility tooling.
sentencepiece = ["sentencepiece>=0.2"]
# Common Crawl index seed query (DuckDB) + Scrapy focused crawler + extraction (roadmap
# step 3). trafilatura range kept compatible with datatrove's pin so the lock stays universal.
crawl = ["duckdb>=1.1", "trafilatura>=1.8,<1.12", "scrapy>=2.13", "warcio>=1.7", "requests>=2.32"]

[project.scripts]
tc-run-hplt = "turkish_corpus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "pipeline: tests that require the optional `pipeline` extra (datatrove)",
    "crawl: tests that require the optional `crawl` extra (scrapy/duckdb/trafilatura)",
    "sources: tests that require the optional `sources` extra (datasets/requests)",
    "academic: tests that require the optional `academic` extra (pypdf/pdfplumber)",
]
